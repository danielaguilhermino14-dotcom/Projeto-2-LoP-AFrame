<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<style>
    #ui {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 1.5rem;
    font-family: monospace;
    z-index: 999;
    background: rgba(0,0,0,0.6);
    padding: 6px 16px;
    border-radius: 8px;
}
</style>
</head>
<body>
<video id="webcam" style="display:none" playsinline></video>
<div id="ui">Carregando modelo...</div>

<a-scene>
    <a-box id="box" position="0 1.5 -3" color="blue"></a-box>
    <a-sky color="#111"></a-sky>
</a-scene>

<script type="module">
    import { GestureRecognizer, FilesetResolver } from
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js";

    async function init() {
    const video = document.getElementById("webcam");
    const box = document.getElementById("box");
    const ui = document.getElementById("ui");

    // Carrega o modelo
    const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
    );
    const recognizer = await GestureRecognizer.createFromOptions(vision, {
    baseOptions: {
    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task"
},
    numHands: 1,
    runningMode: "VIDEO"
});

    ui.textContent = "Abrindo câmera...";

    // Liga a câmera
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    await video.play();

    ui.textContent = "—";

    // Debounce
    let lastGesture = "";
    let lastTime = 0;

    const gestureActions = {
    Thumb_Up:    () => box.setAttribute("color", "green"),
    Thumb_Down:  () => box.setAttribute("color", "red"),
    Victory:     () => box.setAttribute("rotation", "0 45 0"),
    Open_Palm:   () => box.setAttribute("rotation", "0 0 0"),
    Closed_Fist: () => box.setAttribute("scale", "2 2 2"),
    Pointing_Up: () => box.setAttribute("scale", "1 1 1"),
};

    function detect() {
    const results = recognizer.recognizeForVideo(video, performance.now());

    if (results.gestures.length > 0) {
    const gesture = results.gestures[0][0];
    const name = gesture.categoryName;
    const score = (gesture.score * 100).toFixed(0);

    ui.textContent = `${name} (${score}%)`;

    if (name !== lastGesture && performance.now() - lastTime > 500) {
    gestureActions[name]?.();
    lastGesture = name;
    lastTime = performance.now();
}
} else {
    ui.textContent = "—";
    lastGesture = "";
}

    requestAnimationFrame(detect);
}

    detect();
}

    init().catch(err => {
    document.getElementById("ui").textContent = "Erro: " + err.message;
    console.error(err);
});
</script>
</body>
</html>
