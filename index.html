<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carro 3D — Controle por Gestos Infinito</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #scene-container {
      position: absolute;
      inset: 0;
    }

    /* ── Câmera (canto inferior direito) ───────────────── */
    #cam-wrapper {
      transform: scaleX(-1);
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      background: #111;
    }

    #cam-wrapper video,
    #cam-wrapper canvas {
      display: block;
      width: 220px;
      height: 160px;
      object-fit: cover;
    }

    #cam-wrapper canvas {
      position: absolute;
      top: 0; left: 0;
    }

    /* ── HUD de gestos ─────────────────────────────────── */
    #hud {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gesture-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gesture-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }

    .gesture-icon.active {
      border-color: #00ffcc;
      background: rgba(0,255,204,0.15);
      box-shadow: 0 0 12px rgba(0,255,204,0.5);
    }

    .gesture-label {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Status HUD  ──────────────────────────────────── */
    #status-badge {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(0,0,0,0.65);
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      letter-spacing: 0.1em;
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── Placar ─────────────────────────────────────── */
    #scoreboard {
      position: fixed;
      top: 16px;
      left: 20px;
      z-index: 100;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 10px 16px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .score-line {
      font-size: 13px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.8);
    }

    .score-line span {
      font-size: 18px;
      font-weight: bold;
    }

    #score-val   { color: #ffe94d; }

    /* ── Notificação flutuante ──────────────────────── */
    #notif {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 200;
      font-size: 36px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 30px currentColor;
      pointer-events: none;
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
      opacity: 0;
    }

    #notif.show {
      transform: translate(-50%, -80%) scale(1);
      opacity: 1;
    }

    /* ── Legenda de teclado ────────────────────────────── */
    #kb-hint {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 100;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      line-height: 1.8;
      letter-spacing: 0.05em;
    }

    #kb-hint span { color: rgba(255,255,255,0.75); }

    /* ── Flash de dano ─────────────────────────────────── */
    #damage-flash {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(255, 40, 40, 0.0);
      pointer-events: none;
      transition: background 0.1s;
    }

    #damage-flash.hit {
      background: rgba(255, 40, 40, 0.45);
    }
  </style>
</head>
<body>

<div id="damage-flash"></div>

<div id="scene-container">
  <a-scene embedded style="width:100%;height:100vh;" vr-mode-ui="enabled:false" renderer="antialias:true">

    <a-sky color="#b0d8f5"></a-sky>
    
    <a-plane id="floor-plane" position="0 0 0" rotation="-90 0 0" width="200" height="600"
             material="color:#5a9e5a;roughness:1"></a-plane>

    <a-plane id="road-plane" position="0 0.01 0" rotation="-90 0 0" width="6" height="600"
             color="#555" shadow></a-plane>
             
    <a-plane id="road-line" position="0 0.015 0" rotation="-90 0 0" width="0.25" height="600"
             material="color:#fff;opacity:0.5;transparent:true"></a-plane>

    <a-entity id="car" position="0 0 0" car-controller>
      <a-box position="0 0.45 0" width="1.1" height="0.28" depth="2.3"
             material="color:#cc2222;roughness:0.5;metalness:0.3"></a-box>
      <a-box position="0 0.75 0.1" width="0.95" height="0.42" depth="1.3"
             material="color:#cc2222;roughness:0.5;metalness:0.3"></a-box>

      <a-box position="0 0.82 -0.53"  width="0.9" height="0.3" depth="0.05" rotation="-22 0 0"
             material="color:#9fd3f0;opacity:0.6;transparent:true"></a-box>
      <a-box position="0 0.82 0.75"   width="0.9" height="0.3" depth="0.05" rotation="22 0 0"
             material="color:#9fd3f0;opacity:0.6;transparent:true"></a-box>
      <a-box position="-0.48 0.82 0.1" width="0.04" height="0.28" depth="0.85"
             material="color:#9fd3f0;opacity:0.6;transparent:true"></a-box>
      <a-box position="0.48 0.82 0.1"  width="0.04" height="0.28" depth="0.85"
             material="color:#9fd3f0;opacity:0.6;transparent:true"></a-box>

      <a-box position="-0.3 0.46 -1.17" width="0.22" height="0.1" depth="0.05"
             material="color:#ffffcc;emissive:#ffff88;emissiveIntensity:0.5"></a-box>
      <a-box position="0.3 0.46 -1.17"  width="0.22" height="0.1" depth="0.05"
             material="color:#ffffcc;emissive:#ffff88;emissiveIntensity:0.5"></a-box>

      <a-box position="-0.3 0.46 1.17" width="0.22" height="0.1" depth="0.05"
             material="color:#ff4444;emissive:#cc0000;emissiveIntensity:0.4"></a-box>
      <a-box position="0.3 0.46 1.17"  width="0.22" height="0.1" depth="0.05"
             material="color:#ff4444;emissive:#cc0000;emissiveIntensity:0.4"></a-box>

      <a-box position="0 0.3 -1.17" width="0.7" height="0.12" depth="0.05"
             material="color:#333;roughness:0.6;metalness:0.5"></a-box>

      <a-box position="0 0.3 -1.19" width="1.05" height="0.1" depth="0.06"
             material="color:#888;roughness:0.4;metalness:0.6"></a-box>
      <a-box position="0 0.3 1.19"  width="1.05" height="0.1" depth="0.06"
             material="color:#888;roughness:0.4;metalness:0.6"></a-box>

      <a-box position="0 0.97 0.1" width="0.6" height="0.02" depth="0.65"
             material="color:#111;roughness:0.8"></a-box>

      <a-entity id="wheel-fl" position="-0.63 0.28 -0.78" rotation="0 0 90">
        <a-cylinder radius="0.28" height="0.18" segments-radial="20" material="color:#222;roughness:0.9"></a-cylinder>
        <a-cylinder radius="0.15" height="0.19" segments-radial="12" material="color:#aaa;roughness:0.3;metalness:0.7"></a-cylinder>
      </a-entity>
      <a-entity id="wheel-fr" position="0.63 0.28 -0.78" rotation="0 0 90">
        <a-cylinder radius="0.28" height="0.18" segments-radial="20" material="color:#222;roughness:0.9"></a-cylinder>
        <a-cylinder radius="0.15" height="0.19" segments-radial="12" material="color:#aaa;roughness:0.3;metalness:0.7"></a-cylinder>
      </a-entity>
      <a-entity id="wheel-rl" position="-0.63 0.28 0.78" rotation="0 0 90">
        <a-cylinder radius="0.28" height="0.18" segments-radial="20" material="color:#222;roughness:0.9"></a-cylinder>
        <a-cylinder radius="0.15" height="0.19" segments-radial="12" material="color:#aaa;roughness:0.3;metalness:0.7"></a-cylinder>
      </a-entity>
      <a-entity id="wheel-rr" position="0.63 0.28 0.78" rotation="0 0 90">
        <a-cylinder radius="0.28" height="0.18" segments-radial="20" material="color:#222;roughness:0.9"></a-cylinder>
        <a-cylinder radius="0.15" height="0.19" segments-radial="12" material="color:#aaa;roughness:0.3;metalness:0.7"></a-cylinder>
      </a-entity>
    </a-entity>

    <a-entity id="camera-rig" position="0 2 4.5">
      <a-camera fov="60" near="0.1" far="1000"
                look-controls="enabled:false"
                wasd-controls="enabled:false"></a-camera>
    </a-entity>

    <a-light type="ambient" intensity="0.7" color="#fff"></a-light>
    <a-light type="directional" position="5 10 5" intensity="0.9" color="#fff" castShadow="true"></a-light>
  </a-scene>
</div>

<div id="cam-wrapper">
  <video  id="input-video"  autoplay muted playsinline></video>
  <canvas id="output-canvas"></canvas>
</div>

<div id="hud">
  <div class="gesture-row">
    <div class="gesture-icon" id="icon-fwd">🖐️</div>
    <div class="gesture-label">Mão esq. aberta → Avançar</div>
  </div>
  <div class="gesture-row">
    <div class="gesture-icon" id="icon-bwd">✊</div>
    <div class="gesture-label">Mão esq. fechada → Frear/Ré</div>
  </div>
  <div class="gesture-row">
    <div class="gesture-icon" id="icon-lft">☝️</div>
    <div class="gesture-label">Mão dir. 1 dedo → Esquerda</div>
  </div>
  <div class="gesture-row">
    <div class="gesture-icon" id="icon-rgt">✌️</div>
    <div class="gesture-label">Mão dir. 2 dedos → Direita</div>
  </div>
</div>

<div id="status-badge">⏳ Iniciando câmera…</div>

<div id="scoreboard">
  <div class="score-line">⭐ Pontos: <span id="score-val">0</span></div>
</div>

<div id="notif"></div>

<div id="kb-hint">
  <span>↑</span> Avançar &nbsp; <span>↓</span> Ré<br>
  <span>←</span> Esquerda &nbsp; <span>→</span> Direita<br>
  <span style="font-size:10px;color:rgba(255,255,255,0.3);">Teclado também funciona</span>
</div>

<script>
/* ── Estado global dos gestos ── */
const gestureKeys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

/* ── Estado do jogo ── */
const gameState = {
  score: 0,
  invincible: false,
};

const scoreEl = document.getElementById('score-val');
const notifEl = document.getElementById('notif');
const flashEl = document.getElementById('damage-flash');

let notifTimer = null;

function showNotif(text, color = '#fff') {
  notifEl.textContent = text;
  notifEl.style.color = color;
  notifEl.style.textShadow = `0 0 30px ${color}`;
  notifEl.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => notifEl.classList.remove('show'), 900);
}

function triggerDamageFlash() {
  flashEl.classList.add('hit');
  setTimeout(() => flashEl.classList.remove('hit'), 250);
}

/* ── GERENCIADOR PROCEDURAL DE CENÁRIO ── */
const OBSTACLES = [];
const COLLECTIBLES = [];
const DECORATIONS = []; // Árvores e estética lateral
let currentMaxGeneratedZ = -20;

function spawnElement(type, x, z) {
  const scene = document.querySelector('a-scene');
  
  if (type === 'obstacle') {
    const obs = document.createElement('a-box');
    obs.setAttribute('position', `${x} 0.5 ${z}`);
    obs.setAttribute('width', '1.4');
    obs.setAttribute('height', '1.0');
    obs.setAttribute('depth', '1.4');
    obs.setAttribute('material', 'color:#e05010;roughness:0.5;metalness:0.3');
    scene.appendChild(obs);
    OBSTACLES.push(obs);
    
  } else if (type === 'collectible') {
    const colContainer = document.createElement('a-entity');
    colContainer.setAttribute('position', `${x} 0.6 ${z}`);
    
    const dodef = document.createElement('a-dodecahedron');
    dodef.setAttribute('radius', '0.28');
    dodef.setAttribute('material', 'color:#ffe94d;emissive:#ffcc00;emissiveIntensity:1.2;roughness:0.1;metalness:0.8');
    dodef.setAttribute('animation', 'property:rotation;to:360 360 0;loop:true;dur:2000;easing:linear');
    // Animação usando pulo relativo corrigido (Adeus sombras!)
    dodef.setAttribute('animation__bob', 'property:position;from:0 0 0;to:0 0.4 0;loop:true;dur:1200;dir:alternate;easing:easeInOutSine');
    
    colContainer.appendChild(dodef);
    scene.appendChild(colContainer);
    COLLECTIBLES.push({ el: colContainer, active: true });
    
  } else if (type === 'tree') {
    const tree = document.createElement('a-entity');
    tree.setAttribute('position', `${x} 0 ${z}`);
    
    const trunk = document.createElement('a-cylinder');
    trunk.setAttribute('position', '0 0.6 0');
    trunk.setAttribute('radius', '0.15');
    trunk.setAttribute('height', '1.2');
    trunk.setAttribute('color', '#5c3a1e');
    
    const top = document.createElement('a-cone');
    top.setAttribute('position', '0 1.8 0');
    top.setAttribute('radius-bottom', '0.9');
    top.setAttribute('height', '2');
    top.setAttribute('color', '#2d6a2d');
    
    tree.appendChild(trunk);
    tree.appendChild(top);
    scene.appendChild(tree);
    DECORATIONS.push(tree);
  }
}

function generateSegment(fromZ, toZ) {
  // Passa gerando pedaços a cada 22 metros
  for (let z = fromZ; z > toZ; z -= 22) {
    // Árvores nas margens laterais
    spawnElement('tree', -5.5 - Math.random() * 2, z + (Math.random() * 6 - 3));
    spawnElement('tree',  5.5 + Math.random() * 2, z + (Math.random() * 6 - 3));

    // Decide o que colocar na pista central (-1.8 a 1.8 de largura)
    const rand = Math.random();
    const roadX = (Math.random() * 3.6) - 1.8;
    
    if (rand < 0.35) {
      spawnElement('obstacle', roadX, z);
    } else if (rand < 0.70) {
      spawnElement('collectible', roadX, z - 6);
    }
  }
}

function cleanupPassedElements(carZ) {
  const threshold = carZ + 40; // Exclui tudo que ficou 40m para trás

  // Limpa Obstáculos
  for (let i = OBSTACLES.length - 1; i >= 0; i--) {
    if (OBSTACLES[i].getAttribute('position').z > threshold) {
      OBSTACLES[i].parentNode.removeChild(OBSTACLES[i]);
      OBSTACLES.splice(i, 1);
    }
  }
  // Limpa Moedas
  for (let i = COLLECTIBLES.length - 1; i >= 0; i--) {
    if (COLLECTIBLES[i].el.getAttribute('position').z > threshold) {
      COLLECTIBLES[i].el.parentNode.removeChild(COLLECTIBLES[i].el);
      COLLECTIBLES.splice(i, 1);
    }
  }
  // Limpa Árvores
  for (let i = DECORATIONS.length - 1; i >= 0; i--) {
    if (DECORATIONS[i].getAttribute('position').z > threshold) {
      DECORATIONS[i].parentNode.removeChild(DECORATIONS[i]);
      DECORATIONS.splice(i, 1);
    }
  }
}

function dist2D(ax, az, bx, bz) {
  const dx = ax - bx, dz = az - bz;
  return Math.sqrt(dx*dx + dz*dz);
}

/* ── Componente do controlador do carro ── */
AFRAME.registerComponent('car-controller', {
  init () {
    this.physKeys   = {};
    this.speed      = 0;
    this.maxSpeed   = 0.28;
    this.accel      = 0.014;
    this.friction   = 0.92;
    this.turnSpeed  = 0.045;
    this.angle      = 0;

    this._kd = e => { this.physKeys[e.key] = true;  };
    this._ku = e => { this.physKeys[e.key] = false; };
    window.addEventListener('keydown', this._kd);
    window.addEventListener('keyup',   this._ku);

    this.fl = document.getElementById('wheel-fl');
    this.fr = document.getElementById('wheel-fr');
    this.rl = document.getElementById('wheel-rl');
    this.rr = document.getElementById('wheel-rr');

    // Inicializa os primeiros 250 metros procedurais do mapa
    generateSegment(0, -250);
    currentMaxGeneratedZ = -250;
  },

  tick () {
    const k = key => this.physKeys[key] || gestureKeys[key];

    // Física de Aceleração
    if (k('ArrowUp'))         this.speed = Math.min(this.speed + this.accel,  this.maxSpeed);
    else if (k('ArrowDown')) this.speed = Math.max(this.speed - this.accel, -this.maxSpeed * 0.6);
    else                     this.speed *= this.friction;

    // Direção
    if (Math.abs(this.speed) > 0.001) {
      const dir = this.speed > 0 ? 1 : -1;
      if (k('ArrowLeft'))  this.angle += this.turnSpeed * dir;
      if (k('ArrowRight')) this.angle -= this.turnSpeed * dir;
    }

    // Atualização de posição e rotação do Carro
    const pos = this.el.getAttribute('position');
    pos.x -= Math.sin(this.angle) * this.speed;
    pos.z -= Math.cos(this.angle) * this.speed;
    this.el.setAttribute('position', pos);
    this.el.setAttribute('rotation', {x:0, y: THREE.MathUtils.radToDeg(this.angle), z:0});

    // Rotação visual das rodas
    const roll  = THREE.MathUtils.radToDeg(this.speed * 18);
    const steer = k('ArrowLeft') ? 28 : k('ArrowRight') ? -28 : 0;
    if (this.fl) this.fl.setAttribute('rotation', `${roll} ${steer} 90`);
    if (this.fr) this.fr.setAttribute('rotation', `${roll} ${steer} 90`);
    if (this.rl) this.rl.setAttribute('rotation', `${roll} 0 90`);
    if (this.rr) this.rr.setAttribute('rotation', `${roll} 0 90`);

    /* ── GERENCIAMENTO INFINITO DO CENÁRIO ── */
    // Move o chão e asfalto para acompanhar o carro continuamente
    const floorCenter = Math.floor(pos.z / 200) * 200;
    document.getElementById('floor-plane').setAttribute('position', `0 0 ${floorCenter}`);
    document.getElementById('road-plane').setAttribute('position', `0 0.01 ${floorCenter}`);
    document.getElementById('road-line').setAttribute('position', `0 0.015 ${floorCenter}`);

    // Se o carro chegar perto do fim da zona gerada, cria mais estrada para frente
    if (pos.z < currentMaxGeneratedZ + 120) {
      generateSegment(currentMaxGeneratedZ, currentMaxGeneratedZ - 200);
      currentMaxGeneratedZ -= 200;
      cleanupPassedElements(pos.z);
    }

    /* ── GERENCIAMENTO DE SUAVIZAÇÃO DA CÂMERA ── */
    const rig = document.getElementById('camera-rig');
    if (rig) {
      const currentRigPos = rig.getAttribute('position');
      // Alvo ideal da câmera posicionado atrás do carro baseado no seu ângulo atual
      const targetCamX = pos.x + Math.sin(this.angle) * 4.5;
      const targetCamZ = pos.z + Math.cos(this.angle) * 4.5;
      const targetCamY = pos.y + 2.0;

      // Interpolação Linear (Lerp) para suavizar movimento e rotação brusca
      currentRigPos.x += (targetCamX - currentRigPos.x) * 0.12;
      currentRigPos.z += (targetCamZ - currentRigPos.z) * 0.12;
      currentRigPos.y += (targetCamY - currentRigPos.y) * 0.12;
      
      rig.setAttribute('position', currentRigPos);
      rig.setAttribute('rotation', {x: -12, y: THREE.MathUtils.radToDeg(this.angle), z: 0});
    }

    /* ── Colisões com Obstáculos Procedurais ── */
    if (!gameState.invincible) {
      for (const obs of OBSTACLES) {
        const op = obs.getAttribute('position');
        if (!op) continue;
        if (dist2D(pos.x, pos.z, op.x, op.z) < 1.1) {
          triggerDamageFlash();
          showNotif('💥 Batida!', '#ff4455');
          this.speed *= -0.6; // Empurrão mecânico reverso

          gameState.invincible = true;
          setTimeout(() => { gameState.invincible = false; }, 1500);
          break;
        }
      }
    }

    /* ── Colisões com Coletáveis Procedurais ── */
    for (const col of COLLECTIBLES) {
      if (!col.active) continue;
      const cp = col.el.getAttribute('position');
      if (!cp) continue;
      if (dist2D(pos.x, pos.z, cp.x, cp.z) < 0.85) {
        col.active = false;
        col.el.setAttribute('visible', 'false');
        gameState.score += 10;
        scoreEl.textContent = gameState.score;
        showNotif('+10 ⭐', '#ffe94d');
      }
    }
  },

  remove () {
    window.removeEventListener('keydown', this._kd);
    window.removeEventListener('keyup',   this._ku);
  }
});

/* ══════════════════════════════════════════════════════
    MediaPipe Hands
═══════════════════════════════════════════════════════ */
const videoEl  = document.getElementById('input-video');
const canvasEl = document.getElementById('output-canvas');
const ctx      = canvasEl.getContext('2d');
const statusEl = document.getElementById('status-badge');

const iconFwd = document.getElementById('icon-fwd');
const iconBwd = document.getElementById('icon-bwd');
const iconLft = document.getElementById('icon-lft');
const iconRgt = document.getElementById('icon-rgt');

function fingersUp(lm) {
  return [
    lm[8].y  < lm[6].y,
    lm[12].y < lm[10].y,
    lm[16].y < lm[14].y,
    lm[20].y < lm[18].y,
  ];
}

function isOpenHand(lm)      { return fingersUp(lm).every(Boolean); }
function isClosedFist(lm)    { return fingersUp(lm).every(f => !f); }
function isOneFingerUp(lm)   { const f = fingersUp(lm); return  f[0] && !f[1] && !f[2] && !f[3]; }
function isTwoFingersUp(lm)  { const f = fingersUp(lm); return  f[0] &&  f[1] && !f[2] && !f[3]; }

function onResults(results) {
  canvasEl.width  = videoEl.videoWidth  || 220;
  canvasEl.height = videoEl.videoHeight || 160;

  ctx.save();
  ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
  ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);

  gestureKeys.ArrowUp    = false;
  gestureKeys.ArrowDown  = false;
  gestureKeys.ArrowLeft  = false;
  gestureKeys.ArrowRight = false;

  let label = '';

  if (results.multiHandLandmarks && results.multiHandedness) {
    for (let i = 0; i < results.multiHandLandmarks.length; i++) {
      const lm   = results.multiHandLandmarks[i];
      const side = results.multiHandedness[i].label;

      drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: 'rgba(0,255,200,0.7)', lineWidth: 1.5 });
      drawLandmarks(ctx, lm, { color: '#fff', lineWidth: 1, radius: 3 });

      if (side === 'Right') {
        if (isOpenHand(lm))        { gestureKeys.ArrowUp   = true; label += '🖐 Avançar  '; }
        else if (isClosedFist(lm)) { gestureKeys.ArrowDown = true; label += '✊ Ré  '; }
      }

      if (side === 'Left') {
        if (isOneFingerUp(lm))       { gestureKeys.ArrowLeft  = true; label += '☝️ Esquerda  '; }
        else if (isTwoFingersUp(lm)) { gestureKeys.ArrowRight = true; label += '✌️ Direita  '; }
      }
    }
  }

  ctx.restore();

  iconFwd.classList.toggle('active', gestureKeys.ArrowUp);
  iconBwd.classList.toggle('active', gestureKeys.ArrowDown);
  iconLft.classList.toggle('active', gestureKeys.ArrowLeft);
  iconRgt.classList.toggle('active', gestureKeys.ArrowRight);

  statusEl.textContent = label || '🤲 Aguardando gestos…';
}

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands:            2,
  modelComplexity:        0,
  minDetectionConfidence: 0.7,
  minTrackingConfidence:  0.6,
});

hands.onResults(onResults);

const camera = new Camera(videoEl, {
  onFrame: async () => { await hands.send({ image: videoEl }); },
  width:  180,
  height: 120,
  framerate: 12,
});

camera.start()
  .then(() => { statusEl.textContent = '🤲 Aguardando gestos…'; })
  .catch(err => {
    console.error(err);
    statusEl.textContent = '⚠️ Câmera bloqueada — use o teclado';
  });
</script>
</body>
</html>
